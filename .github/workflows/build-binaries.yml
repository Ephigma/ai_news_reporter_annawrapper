# Builds the bundled Executa as a standalone binary for the four platforms Anna
# installs on, packages each as the archive executa.json's binary_artifacts
# expects, and smoke-tests the binary extracted from that archive on its own OS.
#
# Download the archives into executas/ai-news-reporter/dist/ before running
# `anna-app apps publish`:
#   gh run download <run-id> --pattern 'ai-news-reporter-*' --dir executas/ai-news-reporter/dist
# A pushed tag v<version> also attaches them to a GitHub Release.
name: Build Executa binaries

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, os: macos-14, arch: arm64 }
          # Intel macOS runners are being retired; x64 Python under Rosetta 2 on an
          # Apple Silicon runner produces an x86_64 binary (same as Anna's examples).
          - { platform: darwin-x86_64, os: macos-15, arch: x64 }
          # The oldest available Ubuntu: a PyInstaller binary needs a glibc at least
          # as new as the build host's, and the Cloud Agent's glibc is not published.
          - { platform: linux-x86_64, os: ubuntu-22.04, arch: x64 }
          - { platform: windows-x86_64, os: windows-latest, arch: x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - uses: astral-sh/setup-uv@v6

      - name: Tests
        env:
          UV_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          uv run --project executas/ai-news-reporter python tests/test_config.py
          uv run --project executas/ai-news-reporter python tests/test_plugin.py

      - name: Build, package and smoke-test
        env:
          UV_PYTHON: ${{ steps.py.outputs.python-path }}
        run: uv run --project executas/ai-news-reporter python scripts/build_binary.py

      - uses: actions/upload-artifact@v4
        with:
          name: ai-news-reporter-${{ matrix.platform }}
          path: executas/ai-news-reporter/dist/*
          if-no-files-found: error

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: executas/ai-news-reporter/dist/*
