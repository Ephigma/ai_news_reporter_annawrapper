[project]
name = "anna-ai-news-reporter"
version = "0.1.0"
description = "Anna Executa plugin for AI News Reporter (Tavily search + host LLM summaries)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://github.com/Ephigma/ai_news_reporter"

[project.scripts]
anna-ai-news-reporter = "anna_ai_news_reporter.plugin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anna_ai_news_reporter"]
